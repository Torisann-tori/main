<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>はじめまして｜自己紹介ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f7f4;
    --paper: #ffffff;
    --ink: #2f3b37;
    --sub: #7a8a84;
    --rule: #dcebe4;
    --line: #d5e3dc;
    --accent: #357f6b;
    --accent-dark: #2b6958;
    --mark: #fff1a8;
    --danger: #b8453f;
    --font: "Klee One", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); line-height: 1.8;
    -webkit-text-size-adjust: 100%;
  }
  a, button, input, select, textarea { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px; }

  /* ---- ヘッダー ---- */
  header { padding: 52px 0 20px; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: clamp(1.9rem, 8vw, 2.5rem); font-weight: 600; letter-spacing: .06em; line-height: 1.4; }
  h1 span { background: linear-gradient(transparent 62%, var(--mark) 62%); padding: 0 .1em; }
  header p { margin: 6px 0 0; color: var(--sub); font-size: .95rem; }
  .doodle { flex: none; width: 64px; height: 64px; }

  /* ---- タブ ---- */
  .tabs { display: flex; gap: 8px; padding-bottom: 20px; }
  .tab {
    flex: 1; border: 1.5px solid var(--line); background: transparent; color: var(--sub);
    border-radius: 999px; padding: 8px 0; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---- 一覧（ノート風カード） ---- */
  #list { display: grid; gap: 28px; padding: 8px 0 64px; }
  .card {
    position: relative;
    background: var(--paper);
    border-radius: 6px;
    padding: 28px 22px 10px;
    box-shadow: 0 1px 0 var(--line), 0 6px 14px rgba(47, 59, 55, .05);
  }
  .card::before { /* マスキングテープ */
    content: ""; position: absolute; top: -10px; left: 50%;
    width: 84px; height: 22px; transform: translateX(-50%) rotate(-2deg);
    background: var(--tape, #fff1a8); opacity: .85;
  }
  .name { margin: 0; font-size: 1.3rem; font-weight: 600; word-break: break-word; line-height: 1.5; }
  .meta { margin: 0 0 6px; color: var(--sub); font-size: .9rem; }
  .meta .no { color: var(--accent); font-weight: 600; }
  .paper { /* 罫線 */
    line-height: 2em; font-size: .98rem;
    background-image: repeating-linear-gradient(to bottom, transparent 0 calc(2em - 1px), var(--rule) calc(2em - 1px) 2em);
  }
  .paper p { margin: 0; word-break: break-word; white-space: pre-wrap; }
  .paper .lb { color: var(--sub); font-size: .8rem; margin-right: .5em; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: .8rem; color: var(--sub); }
  .del { border: 0; background: none; color: var(--sub); font-size: .8rem; padding: 4px 8px; border-radius: 8px; cursor: pointer; }
  .del:hover { color: var(--danger); background: #fbeeed; }
  .empty { color: var(--sub); text-align: center; padding: 40px 0; }

  /* ---- フォーム ---- */
  #writePanel { padding-bottom: 64px; }
  .sheet { background: var(--paper); border-radius: 6px; padding: 24px 22px 28px; box-shadow: 0 1px 0 var(--line), 0 6px 14px rgba(47, 59, 55, .05); }
  form { display: grid; gap: 18px; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: .95rem; }
  .hint { font-weight: 400; font-size: .8rem; color: var(--sub); }
  input, select, textarea {
    width: 100%; border: 0; border-bottom: 2px solid var(--line); border-radius: 0;
    padding: 8px 4px; background: transparent; color: var(--ink);
    font-size: 1rem; font-weight: 400;
  }
  input:focus, select:focus, textarea:focus { border-bottom-color: var(--accent); outline: none; }
  textarea { min-height: 88px; resize: vertical; border: 2px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  textarea:focus { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 460px) { .row { grid-template-columns: 1fr 1fr; } .row label:last-child { grid-column: 1 / -1; } }
  .btn {
    border: 0; border-radius: 999px; padding: 12px 28px;
    background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; letter-spacing: .05em; cursor: pointer;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: #e7f0ec; color: var(--ink); }
  .btn.ghost:hover { background: #dbe8e2; }
  .btn.danger { background: var(--danger); }
  form .btn { justify-self: start; }
  .err { color: var(--danger); font-size: .85rem; min-height: 1.4em; margin: 0; }
  [hidden] { display: none !important; }

  /* ---- 削除ダイアログ ---- */
  dialog { border: 0; border-radius: 12px; padding: 24px; width: min(92vw, 380px); color: var(--ink); font-family: var(--font); }
  dialog::backdrop { background: rgba(47, 59, 55, .35); }
  dialog p { margin: 0 0 12px; }
  dialog input { border: 2px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }

  /* ---- 通知 ---- */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 22px;
    border-radius: 999px; font-size: .9rem; opacity: 0; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) { #toast { transition: opacity .25s; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <h1><span>はじめまして</span></h1>
      <p>わたしたちの自己紹介ノート</p>
    </div>
    <!-- ボールの落書き -->
    <svg class="doodle" viewBox="0 0 64 64" aria-hidden="true" fill="none" stroke="#2f3b37" stroke-width="2" stroke-linecap="round">
      <circle cx="32" cy="32" r="26"/>
      <path d="M32 6V58M6 32H58"/>
      <path d="M13 13C23 22 23 42 13 51M51 13C41 22 41 42 51 51"/>
    </svg>
  </div>
</header>

<main class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabList" aria-selected="true" aria-controls="listPanel">みんなの自己紹介</button>
    <button class="tab" role="tab" id="tabWrite" aria-selected="false" aria-controls="writePanel">書く</button>
  </div>

  <section id="listPanel" role="tabpanel" aria-labelledby="tabList">
    <div id="list" aria-live="polite"><p class="empty">読み込み中です…</p></div>
  </section>

  <section id="writePanel" role="tabpanel" aria-labelledby="tabWrite" hidden>
    <div class="sheet">
      <form id="form" autocomplete="off">
        <label>ニックネーム
          <input name="nickname" maxlength="20" required placeholder="例：はる">
          <span class="hint">本名や学校名は書かなくて大丈夫です</span>
        </label>
        <div class="row">
          <label>学年
            <select name="grade">
              <option value="">えらぶ</option>
              <option>1年</option><option>2年</option><option>3年</option>
            </select>
          </label>
          <label>ポジション
            <select name="position">
              <option value="">えらぶ</option>
              <option>PG</option><option>SG</option><option>SF</option>
              <option>PF</option><option>C</option><option>マネージャー</option>
            </select>
          </label>
          <label>背番号
            <input name="number" inputmode="numeric" pattern="\d{1,2}" maxlength="2" placeholder="例：7">
          </label>
        </div>
        <label>すきなもの
          <input name="likes" maxlength="60" placeholder="例：シュート練習、カフェめぐり">
        </label>
        <label>ひとこと
          <textarea name="message" maxlength="200" placeholder="よろしくお願いします！"></textarea>
        </label>
        <label>削除用のあいことば
          <input name="passcode" type="password" minlength="4" required autocomplete="new-password">
          <span class="hint">4文字以上。あとで自分の自己紹介を消すときに使います</span>
        </label>
        <p class="err" id="formErr" role="alert"></p>
        <button class="btn" type="submit" id="submitBtn">ノートにのせる</button>
      </form>
    </div>
  </section>
</main>

<dialog id="delDialog">
  <form id="delForm">
    <p><strong id="delName"></strong> さんの自己紹介を削除します。<br>登録したあいことばを入力してください。</p>
    <input id="delPass" type="password" autocomplete="off" aria-label="あいことば">
    <p class="err" id="delErr" role="alert"></p>
    <div class="actions">
      <button class="btn ghost" type="button" id="delCancel">やめる</button>
      <button class="btn danger" type="submit" id="delOk">削除する</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script>
  // ★ GAS をウェブアプリとしてデプロイしたときの URL をここに貼る
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbx0rzxWIiUxk3FhqKY1nyguYtEbJIajKdpHYd5zITRtmFiWWd20_eKjKuTrrjfEKdlqtQ/exec';

  const $ = (s) => document.querySelector(s);
  const listEl = $('#list');
  const TAPES = ['#fff1a8', '#fbd3dc', '#cdeede', '#cfe6f7', '#e0daf5'];
  let deleteTarget = null;

  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  /* ---- タブ切り替え ---- */
  function showTab(which) {
    const isList = which === 'list';
    $('#tabList').setAttribute('aria-selected', isList);
    $('#tabWrite').setAttribute('aria-selected', !isList);
    $('#listPanel').hidden = !isList;
    $('#writePanel').hidden = isList;
  }
  $('#tabList').addEventListener('click', () => showTab('list'));
  $('#tabWrite').addEventListener('click', () => showTab('write'));

  async function post(payload) {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      // text/plain にすると CORS のプリフライトが不要になり、GAS で動く
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'うまくいきませんでした');
    return data;
  }

  async function load() {
    if (!GAS_URL.startsWith('https://')) {
      listEl.innerHTML = '<p class="empty">index.html の GAS_URL を設定してください。</p>';
      return;
    }
    try {
      const res = await fetch(GAS_URL + '?action=list');
      const data = await res.json();
      if (!data.ok) throw new Error();
      render(data.items);
    } catch (e) {
      listEl.innerHTML = '<p class="empty">読み込めませんでした。時間をおいて、もう一度ひらいてね。</p>';
    }
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text; // textContent なので入力内容はHTMLとして実行されない
    return n;
  }

  function render(items) {
    listEl.replaceChildren();
    if (!items.length) {
      listEl.append(el('p', 'empty', 'まだだれものっていません。最初のひとりになってみよう。'));
      return;
    }
    for (const it of items) {
      const card = el('article', 'card');
      let h = 0;
      for (const c of String(it.id)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      card.style.setProperty('--tape', TAPES[h % TAPES.length]);

      card.append(el('h2', 'name', it.nickname));

      const meta = el('p', 'meta');
      const parts = [];
      if (it.number) { const no = el('span', 'no', '#' + it.number); parts.push(no); }
      if (it.grade) parts.push(document.createTextNode(it.grade));
      if (it.position) parts.push(document.createTextNode(it.position));
      parts.forEach((p, i) => { if (i) meta.append(document.createTextNode(' ・ ')); meta.append(p); });
      if (parts.length) card.append(meta);

      if (it.likes || it.message) {
        const paper = el('div', 'paper');
        if (it.likes) {
          const p = el('p');
          p.append(el('span', 'lb', 'すきなもの'), document.createTextNode(it.likes));
          paper.append(p);
        }
        if (it.message) {
          const p = el('p');
          p.append(el('span', 'lb', 'ひとこと'), document.createTextNode(it.message));
          paper.append(p);
        }
        card.append(paper);
      }

      const foot = el('div', 'foot');
      const d = new Date(it.createdAt);
      foot.append(el('span', '', isNaN(d) ? '' : `${d.getMonth() + 1}/${d.getDate()}`));
      const del = el('button', 'del', '削除');
      del.type = 'button';
      del.addEventListener('click', () => openDelete(it));
      foot.append(del);
      card.append(foot);
      listEl.append(card);
    }
  }

  /* ---- 登録 ---- */
  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#submitBtn');
    const err = $('#formErr');
    err.textContent = '';
    btn.disabled = true;
    try {
      const f = Object.fromEntries(new FormData(e.target));
      await post({ action: 'create', ...f });
      e.target.reset();
      showTab('list');
      toast('のせました！');
      await load();
      window.scrollTo(0, 0);
    } catch (ex) {
      err.textContent = ex.message;
    } finally {
      btn.disabled = false;
    }
  });

  /* ---- 削除（論理削除） ---- */
  const dlg = $('#delDialog');
  function openDelete(it) {
    deleteTarget = it;
    $('#delName').textContent = it.nickname;
    $('#delPass').value = '';
    $('#delErr').textContent = '';
    dlg.showModal();
    $('#delPass').focus();
  }
  $('#delCancel').addEventListener('click', () => dlg.close());
  $('#delForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const ok = $('#delOk');
    ok.disabled = true;
    try {
      await post({ action: 'delete', id: deleteTarget.id, passcode: $('#delPass').value });
      dlg.close();
      toast('削除しました');
      await load();
    } catch (ex) {
      $('#delErr').textContent = ex.message;
    } finally {
      ok.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
